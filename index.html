<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Repertorio - Ministerio ALABANZA</title>
    <link rel="icon" type="image/png" href="LOGO_REINO_PNG.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Plataforma Levitas</h1>
        <input type="text" id="buscador" placeholder="Buscar alabanza...">
        <button id="btn-ver-lista">Ver mi lista (0)</button>
        <button id="btn-exportar-pdf" style="display: none; background-color: #2ecc71; color: white;">Exportar lista a PDF</button>
        <!-- Botón para abrir el panel (Agregalo junto a tus otros botones del header) -->
<button id="btn-abrir-admin" style="background-color: #9b59b6; color: white; margin-left: 10px;">Añadir Canción (IA)</button>

<!-- Panel flotante de Inteligencia Artificial (Pégalo justo antes de cerrar el </header>) -->
<div id="panel-admin-ia" style="display: none; position: absolute; top: 70px; right: 20px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 1000; border: 2px solid var(--dorado); color: black;">
    <h3 style="margin-top:0; color: var(--azul-marino);">Asistente de Transcripción</h3>
    <p style="font-size: 0.9rem; color: #555;">Sube Las capturas de la canción.</p>
    
    <input type="file" id="input-imagenes-ia" accept="image/*" multiple style="margin-bottom: 15px; width: 100%;">
    
    <div style="display: flex; gap: 10px; justify-content: flex-end;">
        <button id="btn-cerrar-admin" style="background: #ccc; color: black;">Cancelar</button>
        <button id="btn-procesar-ia" style="background: #2ecc71; color: white;">Procesar Imágenes</button>
    </div>
    <div id="mensaje-estado-ia" style="margin-top: 15px; font-weight: bold; color: #e67e22; text-align: center;"></div>
</div>
    </header>

    
    <main>
        <section id="lista-canciones">
            <h2>Repertorio Disponible</h2>
            <ul id="contenedor-lista">
                <li>Cargando canciones...</li>
            </ul>
        </section>

        <section id="visor-cancion">
            <h2 id="titulo-cancion">Selecciona una alabanza</h2>
            <button id="btn-diccionario" onclick="abrirDiccionario()">Ver Acordes </button>

<div id="diccionario-acordes">
    <button onclick="cerrarDiccionario()" style="background:red; color:white;">Cerrar Diccionario</button>
    <h3>Diccionario de Acordes</h3>
    <div id="contenedor-diagramas" style="display: flex; gap: 20px; flex-wrap: wrap; justify-content: center;"></div>
</div>
            <div id="controles-tono" style="display: none;">
                <button id="bajar-tono">-1 Tono</button>
                <span id="tono-actual">Tono: -</span>
                <button id="subir-tono">+1 Tono</button>
                
                <button id="btn-agregar-lista">Añadir a lista</button>
                <button id="btn-pantalla-completa" style="background-color: var(--azul-marino); color: white; margin-left: 10px;">⛶ Expandir vista</button>
            </div>

            <div id="letra-cancion">
                </div>
        </section>
    </main>
    <script src="chordbox.min.js"></script>
    <script src="diccionarios.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
