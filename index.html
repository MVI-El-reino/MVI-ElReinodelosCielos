<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repertorio - Ministerio ALABANZA</title>
    <link rel="stylesheet" href="style.css">
    <script src="chordbox.min.js"></script>
</head>
<body>

    <header>
        <h1>Plataforma Levitas</h1>
        <input type="text" id="buscador" placeholder="Buscar alabanza...">
        <button id="btn-ver-lista">Ver mi lista (0)</button>
        <button id="btn-exportar-pdf" style="display: none; background-color: #2ecc71; color: white;">Exportar lista a PDF</button>
    </header>

    <main>
        <section id="lista-canciones">
            <h2>Repertorio Disponible</h2>
            <ul id="contenedor-lista">
                <li>Cargando canciones...</li>
            </ul>
        </section>

        <section id="visor-cancion">
            <h2 id="titulo-cancion">Selecciona una alabanza</h2>
            <button id="btn-diccionario" onclick="abrirDiccionario()">Ver Acordes </button>

<div id="diccionario-acordes">
    <button onclick="cerrarDiccionario()" style="background:red; color:white;">Cerrar Diccionario</button>
    <h3>Diccionario de Acordes</h3>
    <div id="contenedor-diagramas" style="display: flex; gap: 20px; flex-wrap: wrap; justify-content: center;"></div>
</div>
            <div id="controles-tono" style="display: none;">
                <button id="bajar-tono">-1 Tono</button>
                <span id="tono-actual">Tono: -</span>
                <button id="subir-tono">+1 Tono</button>
                
                <button id="btn-agregar-lista">Añadir a lista</button>
                <button id="btn-pantalla-completa" style="background-color: var(--azul-marino); color: white; margin-left: 10px;">⛶ Expandir vista</button>
            </div>

            <div id="letra-cancion">
                </div>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
